<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Northwind Knowledge Base</title>
<style>body{font-family:sans-serif;max-width:760px;margin:24px auto}li{margin:8px 0}</style></head>
<body>
<h1>Northwind Knowledge Base</h1>
<form id="search" role="search">
  <label for="q">Search articles</label>
  <input id="q" name="q" type="search" placeholder="Search the knowledge base">
  <button type="submit">Search</button>
</form>
<p id="hint">Type a product name and press Search.</p>
<ul id="results"></ul>
<article id="article" hidden></article>
<script>
  const ARTICLES = [
    { id: 'kestrel-1', title: 'Kestrel 1 overview', body: 'Kestrel 1 was the first router in the Kestrel line. It shipped in 2014 with a single 2.4 GHz radio.' },
    { id: 'kestrel-3', title: 'Kestrel 3 release notes', body: 'Kestrel 3 was released in 2019. It added Wi-Fi 6, a 1.8 GHz quad-core CPU and mesh support.' },
    { id: 'osprey', title: 'Osprey NAS setup guide', body: 'Osprey supports up to four drives. It launched in 2021.' }
  ];
  const results = document.getElementById('results');
  const article = document.getElementById('article');
  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim().toLowerCase();
    article.hidden = true;
    results.innerHTML = '';
    const hits = ARTICLES.filter(a => q && a.title.toLowerCase().includes(q));
    document.getElementById('hint').textContent = hits.length ? `${hits.length} result(s) for "${q}"` : `No results for "${q}"`;
    for (const a of hits) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + a.id;
      link.textContent = a.title;
      link.addEventListener('click', (ev) => {
        ev.preventDefault();
        article.innerHTML = `<h2>${a.title}</h2><p>${a.body}</p>`;
        article.hidden = false;
      });
      li.appendChild(link);
      results.appendChild(li);
    }
  });
</script>
</body>
</html>
