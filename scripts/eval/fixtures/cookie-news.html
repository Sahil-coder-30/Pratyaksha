<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Daily Lantern - Culture</title>
<style>
  body{font-family:serif;max-width:720px;margin:24px auto}
  #consent{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  #consent .box{background:#fff;padding:20px;margin:20px;max-width:640px;font-family:sans-serif}
</style></head>
<body>
<h1>The Daily Lantern</h1>
<h2>Desert Lights music festival announces 2027 dates</h2>
<p class="byline">By Mira Sen</p>
<div id="story"><p>Subscribe or accept cookies to continue reading.</p></div>
<div id="consent" role="dialog" aria-modal="true" aria-label="Cookie consent">
  <div class="box">
    <p>We use cookies to personalise content and measure traffic. You can accept all cookies or reject non-essential ones.</p>
    <button id="accept">Accept all</button>
    <button id="reject">Reject non-essential</button>
  </div>
</div>
<script>
  function reveal(choice) {
    window.__evalState = { consent: choice };
    document.getElementById('consent').remove();
    document.getElementById('story').innerHTML =
      '<p>The Desert Lights festival returns next February. Organisers confirmed it will again take place in Udaipur, on the shores of Lake Pichola.</p>' +
      '<p>Tickets go on sale in November.</p>';
  }
  document.getElementById('accept').onclick = () => reveal('accept');
  document.getElementById('reject').onclick = () => reveal('reject');
</script>
</body>
</html>
