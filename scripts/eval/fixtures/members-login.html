<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Members area - Sign in</title>
<style>body{font-family:sans-serif;max-width:420px;margin:24px auto}label{display:block;margin-top:10px}</style></head>
<body>
<h1>Members area</h1>
<p>Sign in to view billing, invoices and downloads.</p>
<form id="login">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <p><button type="submit">Sign in</button></p>
</form>
<p id="err" role="alert"></p>
<script>
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    window.__evalState = { loginAttempted: true };
    document.getElementById('err').textContent = 'Incorrect email or password.';
  });
</script>
</body>
</html>
