<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout - Shipping details</title>
<style>body{font-family:sans-serif;max-width:560px;margin:24px auto}label{display:block;margin-top:12px}</style></head>
<body>
<h1>Shipping details</h1>
<form id="ship">
  <label for="fullname">Full name</label>
  <input id="fullname" name="fullname" autocomplete="off" required>
  <label for="country">Country</label>
  <select id="country" name="country" required>
    <option value="">Choose a country</option>
    <option value="US">United States</option>
    <option value="IN">India</option>
    <option value="DE">Germany</option>
    <option value="JP">Japan</option>
  </select>
  <label for="speed">Shipping speed</label>
  <select id="speed" name="speed">
    <option value="standard" selected>Standard (5-7 days)</option>
    <option value="express">Express (2 days)</option>
    <option value="overnight">Overnight</option>
  </select>
  <p><button type="submit">Save shipping details</button></p>
</form>
<p id="status" role="status"></p>
<script>
  document.getElementById('ship').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (!data.fullname || !data.country) {
      document.getElementById('status').textContent = 'Please fill in all required fields.';
      return;
    }
    window.__evalState = { submitted: data };
    document.getElementById('status').textContent =
      `Saved. Shipping to ${data.fullname}, ${data.country}, speed: ${data.speed}. Reference SHP-4471.`;
  });
</script>
</body>
</html>
