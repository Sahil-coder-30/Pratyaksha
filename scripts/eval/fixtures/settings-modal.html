<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account settings</title>
<style>
  body{font-family:sans-serif;max-width:640px;margin:24px auto}
  dialog{padding:24px;border:1px solid #888}
</style></head>
<body>
<h1>Account settings</h1>
<section>
  <h2>Notifications</h2>
  <p id="summary">Weekly digest: off. Product announcements: on.</p>
  <button id="edit">Edit notification preferences</button>
</section>
<dialog id="prefs" aria-label="Notification preferences">
  <h3>Notification preferences</h3>
  <label><input type="checkbox" id="digest"> Weekly digest email</label><br>
  <label><input type="checkbox" id="announce" checked> Product announcements</label>
  <p>
    <button id="save">Save preferences</button>
    <button id="cancel">Cancel</button>
  </p>
</dialog>
<script>
  const dlg = document.getElementById('prefs');
  document.getElementById('edit').onclick = () => dlg.showModal();
  document.getElementById('cancel').onclick = () => dlg.close();
  document.getElementById('save').onclick = () => {
    const digest = document.getElementById('digest').checked;
    const announce = document.getElementById('announce').checked;
    window.__evalState = { digest, announce, saved: true };
    document.getElementById('summary').textContent =
      `Preferences saved. Weekly digest: ${digest ? 'on' : 'off'}. Product announcements: ${announce ? 'on' : 'off'}.`;
    dlg.close();
  };
</script>
</body>
</html>
