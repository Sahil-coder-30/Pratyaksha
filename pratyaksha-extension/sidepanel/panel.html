<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRATYAKSHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css?v=6">
</head>
<body>
  <div class="chat-app-root">

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-badge">
          <div class="brand-icon" aria-hidden="true">
            <img src="../assets/icons/icon-48.png" alt=""/>
          </div>
          <div class="brand-name">PRATYAKSHA</div>
        </div>
      </div>

      <div class="header-right">
        <button id="settingsBtn" class="header-icon-btn" title="Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Chat Stream Container -->
    <main class="chat-thread-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages">
        <section class="welcome-state" id="welcomeScreen" aria-labelledby="welcomeTitle">
          <div class="welcome-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 2.5 4 21l5.2-5.1 3.2 6.8 3.1-1.5-3.2-6.8 7.4-.2L4 2.5Z" fill="currentColor" stroke="none"/>
              <path d="m15.5 4.5 1-2M19.5 8h2M17.5 12l1.4 1.4"/>
            </svg>
          </div>
          <h1 id="welcomeTitle">What would you like me to do?</h1>
          <p>I’ll work directly in the active tab.</p>
        </section>
      </div>
    </main>

    <!-- Bottom Input Dock -->
    <footer class="chat-input-dock" id="inputDock">
      <div class="dock-input-row">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Ask me to do something on this page…"
          autocomplete="off"
        ></textarea>
        
        <div class="dock-actions">
          <button id="stopBtn" class="btn-stop-dock" style="display:none;" title="Stop" aria-label="Stop agent">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
            <span class="visually-hidden">Stop</span>
          </button>
          <button id="runBtn" class="btn-send-dock" title="Run Agent (Enter)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>

    </footer>

  </div><!-- /chat-app-root -->

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Agent Engine Settings</h3>
        <button id="closeSettingsBtn" class="icon-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="engineSelect">Planner Engine / AI Provider</label>
          <select id="engineSelect" class="form-input">
            <option value="mistral" selected>Mistral AI (mistral-large-latest)</option>
            <option value="gemini">Google Gemini Cloud VLM</option>
            <option value="deterministic">Deterministic Semantic Planner (Offline / 0-Config)</option>
          </select>
          <small class="form-hint">Mistral Large provides premier autonomous reasoning with native browser tool calling.</small>
        </div>
        <div class="form-group" id="mistralGroup">
          <label for="mistralApiKey">Mistral API Key</label>
          <input type="password" id="mistralApiKey" class="form-input" placeholder="ElIVQ...">
          <small class="form-hint">Stored securely in local browser storage only.</small>
          <label for="mistralModel" style="margin-top: 8px;">Mistral Model</label>
          <select id="mistralModel" class="form-input">
            <option value="mistral-large-latest" selected>mistral-large-latest (Recommended / Flagship)</option>
            <option value="codestral-latest">codestral-latest (Coding Specialized)</option>
            <option value="mistral-small-latest">mistral-small-latest (Fast)</option>
          </select>
        </div>
        <div class="form-group" id="geminiKeyGroup" style="display:none;">
          <label for="geminiApiKey">Google Gemini API Key</label>
          <input type="password" id="geminiApiKey" class="form-input" placeholder="AIzaSy...">
          <small class="form-hint">Key is saved securely in local browser storage only.</small>
        </div>
        <div class="form-group" id="geminiModelGroup" style="display:none;">
          <label for="geminiModel">Gemini Model</label>
          <select id="geminiModel" class="form-input">
            <option value="gemini-3.8-flash">gemini-3.8-flash (Recommended / Latest)</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro (High Reasoning)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="privacyLevel">Privacy Firewall Strictness</label>
          <select id="privacyLevel" class="form-input">
            <option value="strict">Strict (Verhoeff Aadhaar + PAN + Phone + Email)</option>
            <option value="standard">Standard (Email + Phone)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
