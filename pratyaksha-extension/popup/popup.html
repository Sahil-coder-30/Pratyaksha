<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRATYAKSHA Quick Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css?v=2">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="brand-row">
        <div class="brand-emblem">
          <img src="../assets/icons/icon-48.png" alt=""/>
        </div>
        <div class="brand-text">
          <div class="title"><span class="hindi">प्रत्यक्ष</span> PRATYAKSHA</div>
          <div class="subtitle">On-Device Visual Perception Agent</div>
        </div>
      </div>
      <span class="badge-ps">SOVEREIGN AGENT</span>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="label">ACTIVE TAB</span>
        <span class="value" id="popupDomain">Loading...</span>
      </div>
      <div class="status-row">
        <span class="label">PRIVACY SHIELD</span>
        <span class="value-green">100% On-Device</span>
      </div>
    </div>

    <button id="openSidePanelBtn" class="btn-open-panel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="15" y1="3" x2="15" y2="21"/>
      </svg>
      <span>Open Agent Cockpit (Side Panel)</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
