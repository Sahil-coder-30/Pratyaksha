server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pratyaksha-logs
    static_configs:
      - targets:
          - localhost
        labels:
          service: pratyaksha
          source: promtail-file
          __path__: /var/log/pratyaksha/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            eventType: eventType
            phase: phase
            provider: provider
            model: model
            threadId: threadId
            taskId: taskId
            msg: msg
      - labels:
          event_type: eventType
          provider: provider
          phase: phase
