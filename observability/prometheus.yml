global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "pratyaksha-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          application: "pratyaksha"
          environment: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
